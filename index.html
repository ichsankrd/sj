<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SJ</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f3f5f4;--card:#fff;--ink:#16221d;--mute:#5d6b65;--line:#d5dcd8;--acc:#0f6b4f;--acc-ink:#fff;--danger:#b3261e}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121816;--card:#1b2420;--ink:#e8efeb;--mute:#9aa8a1;--line:#2f3b36;--acc:#3fb88f;--acc-ink:#07140f;--danger:#f2b8b5}}
:root[data-theme="dark"]{--bg:#121816;--card:#1b2420;--ink:#e8efeb;--mute:#9aa8a1;--line:#2f3b36;--acc:#3fb88f;--acc-ink:#07140f;--danger:#f2b8b5}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 "Segoe UI",system-ui,-apple-system,Roboto,sans-serif}
#app{max-width:1200px;margin:0 auto;padding:16px 14px 90px}
h1{font-size:20px;margin:6px 0 2px}
.sub{color:var(--mute);margin:0 0 14px}
.bar{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:14px}
label{display:block;font-size:13px;color:var(--mute);margin-bottom:4px}
input{width:100%;font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:8px 10px;min-height:38px}
input:focus,button:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
.chk{display:flex;gap:6px;align-items:center;margin:6px 0 0}.chk input{width:auto;min-height:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:12px}
.hd{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}
#list{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,560px),1fr));gap:12px;align-items:start;margin-bottom:12px}
#list .card{margin:0}
.row .n{margin:0;font-size:inherit;text-align:center}.row .tot{display:block}.row .n small{display:none}
.no{font-weight:700;font-variant-numeric:tabular-nums}
.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin-bottom:10px}
.row{display:grid;grid-template-columns:1fr 62px 62px 62px 62px 56px 32px;gap:6px;align-items:end;margin-bottom:6px}
.row .tot{padding:8px 4px;text-align:center;font-weight:600;font-variant-numeric:tabular-nums}
.row input[type=number]{text-align:center;padding:8px 4px}
.colh{display:grid;grid-template-columns:1fr 62px 62px 62px 62px 56px 32px;gap:6px;font-size:12px;color:var(--mute);text-align:center}
.colh span:first-child{text-align:left}
button{font:inherit;cursor:pointer;border-radius:7px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 12px;min-height:38px}
button.x{padding:0;color:var(--danger);height:38px}
button.pri{background:var(--acc);color:var(--acc-ink);border-color:var(--acc);font-weight:600}
.act{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.dock{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.dock button{min-width:130px}
#print{display:none}
@media (min-width:601px){.hd .chk{margin-left:auto}}
#rekap{margin-top:14px}
.rs{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:8px;margin-bottom:12px}
.rs div{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px;text-align:center}
.rs small{display:block;color:var(--mute);font-size:12px}.rs b{font-size:18px;font-variant-numeric:tabular-nums}
.tw{overflow-x:auto}
.rkt{width:100%;border-collapse:collapse;font-size:14px}
.rkt th,.rkt td{padding:6px 8px;text-align:right;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.rkt th:first-child,.rkt td:first-child{text-align:left}
.rkt tr.g td{font-weight:700;background:var(--bg);text-align:left}
.rkt tr.sb td{font-weight:600}
.rkt tfoot td{font-weight:700;border-top:2px solid var(--ink)}
.act button{flex:1 1 200px}
.dock button{flex:1 1 130px;max-width:420px}
@media (pointer:coarse){button,input{min-height:44px}button.x{height:44px}}
@media (max-width:600px){
  #app{padding:12px 10px 96px}
  .bar{grid-template-columns:1fr 1fr;padding:12px}
  .card{padding:12px}
  .colh{display:none}
  .hd .no{flex:1 1 100%}
  .row{grid-template-columns:repeat(5,1fr);gap:6px 6px;margin-bottom:12px;padding-bottom:12px;border-bottom:1px dashed var(--line)}
  .row>input:first-child{grid-column:1/5;grid-row:1}
  .row>button{grid-column:5;grid-row:1}
  .row .n small{display:block;font-size:12px;color:var(--mute);text-align:center;margin-bottom:2px}
  .row .tot{padding:10px 0}
}

/* ===== Lembar cetak ===== */
.page{font-family:"Times New Roman",Times,serif;font-size:12pt;color:#000;background:#fff;line-height:1.5}
.page .kop{display:flex;align-items:center;border-bottom:1.5pt solid #000;padding-bottom:3pt;margin-bottom:10pt}
.page .kop img{width:22mm;height:22mm;object-fit:contain}
.page .kop div{flex:1;text-align:center;margin-right:22mm;line-height:1.25}
.page .kop b{font-size:12pt;display:block}
.page .kop i{font-size:9pt;display:block}
.page .jd{text-align:center;font-weight:bold;line-height:1.25;margin-bottom:10pt}
.page .jd u{font-style:italic}
.page p{margin:0}
.page .f{display:flex}.page .f span:first-child{width:36mm;flex:none}
.page .isi{text-align:justify;margin:6pt 0 12pt}
.page table{width:100%;border-collapse:collapse;text-align:center;line-height:1.3}
.page th,.page td{border:.75pt solid #000;padding:5pt 4pt;font-weight:normal}
.page td{height:11mm}
.page .ttd{display:flex;justify-content:space-between;margin-top:14pt}
.page .ttd div{width:48%}
.page .gap{height:24mm}
.page .rkt{font-size:11pt}
.page .rkt th,.page .rkt td{text-align:center;height:auto;padding:3pt 4pt;border:.75pt solid #000}
.page .rkt th:first-child,.page .rkt td:first-child,.page .rkt tr.g td{text-align:left}
.page .rkt tr.g td,.page .rkt tr.sb td,.page .rkt tfoot td{font-weight:bold}
.page .rkt th{font-weight:bold}
@media screen{#print{display:none!important}}
@media print{
  @page{size:A4;margin:0}
  html,body{background:#fff}
  #app,.dock{display:none!important}
  #print{display:block!important}
  .page{break-after:page;width:210mm;height:296mm;padding:10mm 30mm 20mm;overflow:hidden}
  .page:last-child{break-after:auto}
  .page.rk{height:auto;min-height:296mm;overflow:visible}
}
</style>
</head>
<body>
<div id="app">
  <h1>Cetak BAST Paket Makanan MBG</h1>
  <p class="sub">Isi data, lalu tekan Cetak. Data tersimpan otomatis di browser ini.</p>
  <div id="gsst" class="sub" style="font-size:13px;margin:-8px 0 12px"></div>
  <div class="bar">
    <div><label for="tgl">Tanggal pengiriman</label><input id="tgl" type="date"><label class="chk"><input id="auto" type="checkbox"> Otomatis (hari ini)</label></div>
    <div><label for="st">Nomor BAST pertama</label><input id="st" type="number" min="1" inputmode="numeric" placeholder="Isi nomor"></div>
    <div><label for="drv">Nama driver (kosongkan jika ditulis tangan)</label><input id="drv" placeholder="............"></div>
    <div><label for="unit">Unit</label><input id="unit"></div>
  </div>
  <div id="list"></div>
  <div class="act">
    <button id="add">+ Tambah BAST</button>
    <button id="sel1">Pilih semua untuk dicetak</button>
    <button id="sel0">Hapus semua pilihan</button>
  </div>
  <div class="card" id="rekap"></div>
</div>
<div class="dock">
  <button class="pri" id="prn">Cetak semua</button>
</div>
<div id="print"></div>

      [["kecil","Kecil"],["besar","Besar"],["tendik","Tendik"],["sampel","Sampel"]].forEach(function(c){
        h+='<label class="n"><small>'+c[1]+'</small><input type="number" min="0" inputmode="numeric" data-b="'+i+'" data-r="'+j+'" data-k="'+c[0]+'" value="'+esc(r[c[0]])+'" aria-label="Porsi '+c[1]+'"></label>'});
      h+='<div class="n"><small>Total</small><span class="tot" id="t'+i+'_'+j+'">'+(num(r.kecil)+num(r.besar)+num(r.tendik)+num(r.sampel))+'</span></div>'+
      '<button class="x" data-rd="'+i+'_'+j+'" aria-label="Hapus baris">×</button></div>';
    });
    h+='<button data-ra="'+i+'">+ Tambah sekolah</button></div>';
  });
  document.getElementById("list").innerHTML=h||'<div class="card">Belum ada BAST. Tekan "+ Tambah BAST".</div>';
}
function tot(){var k=0,b=0,td=0,s=0,n=0;st.bast.forEach(function(o){o.rows.forEach(function(r){k+=num(r.kecil);b+=num(r.besar);td+=num(r.tendik);s+=num(r.sampel);n++})});return {k:k,b:b,d:td,s:s,t:k+b+td+s,n:n}}
function rekapTbl(){
  var h='<table class="rkt"><thead><tr><th>Sekolah</th><th>Siswa Kecil</th><th>Siswa Besar</th><th>Tendik</th><th>Sampel</th><th>Total</th></tr></thead><tbody>';
  st.bast.forEach(function(o,i){
    var k=0,b=0,td=0,s=0;
    h+='<tr class="g"><td colspan="6">No. '+nomor(i)+' &ndash; '+(esc(o.lembaga)||"(lembaga belum diisi)")+'</td></tr>';
    o.rows.forEach(function(r){var a=num(r.kecil),c=num(r.besar),e=num(r.tendik),d=num(r.sampel);k+=a;b+=c;td+=e;s+=d;
      h+='<tr><td>'+(esc(r.sekolah)||"(belum diisi)")+'</td><td>'+show(a)+'</td><td>'+show(c)+'</td><td>'+show(e)+'</td><td>'+show(d)+'</td><td>'+show(a+c+e+d)+'</td></tr>'});
    if(o.rows.length>1)h+='<tr class="sb"><td>Subtotal</td><td>'+k+'</td><td>'+b+'</td><td>'+td+'</td><td>'+s+'</td><td>'+(k+b+td+s)+'</td></tr>';
  });
  var T=tot();
  return h+'</tbody><tfoot><tr><td>JUMLAH KESELURUHAN</td><td>'+T.k+'</td><td>'+T.b+'</td><td>'+T.d+'</td><td>'+T.s+'</td><td>'+T.t+'</td></tr></tfoot></table>';
}
function renderRekap(){var T=tot();
  document.getElementById("rekap").innerHTML='<div class="hd"><b>Rekap jumlah keseluruhan</b><button id="prk" class="pri">Cetak rekap</button></div>'+
  '<div class="rs"><div><small>BAST</small><b>'+st.bast.length+'</b></div><div><small>Sekolah</small><b>'+T.n+'</b></div><div><small>Kecil</small><b>'+T.k+'</b></div><div><small>Besar</small><b>'+T.b+'</b></div><div><small>Tendik</small><b>'+T.d+'</b></div><div><small>Sampel</small><b>'+T.s+'</b></div><div><small>Total porsi</small><b>'+T.t+'</b></div></div><div class="tw">'+rekapTbl()+'</div>';
  document.getElementById("prk").onclick=printRekap}
function printRekap(){syncTgl();refresh(false);var d=dt(),tg=d?HARI[d.getDay()]+", "+d.getDate()+" "+BLN[d.getMonth()]+" "+d.getFullYear():"...............";
  document.getElementById("print").innerHTML='<section class="page rk">'+'<div class="kop"><img src="'+LOGO+'" alt=""><div><b>SATUAN PELAYANAN PEMENUHAN GIZI (SPPG)</b><b>YAYASAN ABHINAYA DAKARA INDONESIA</b><i>Jl. Pahlawan 69 RT.003 RW.004 Kel. Karangduak, Kecamatan Kota Sumenep,<br>Kabupaten Sumenep Provinsi Jawa Timur</i></div></div>'+'<div class="jd">REKAPITULASI JUMLAH PORSI<br>PAKET MAKANAN PROGRAM MAKAN BERGIZI GRATIS<br>'+tg+'</div>'+rekapTbl()+'</section>';
  window.print();renderPrint()}
function renderPrint(){
  var d=dt(),tg=d?HARI[d.getDay()]+" Tanggal "+d.getDate()+" "+BLN[d.getMonth()]+" "+d.getFullYear():"...............";
  var drv=st.drv?esc(st.drv):"............................................";
  var out=st.bast.map(function(b,i){if(b.print===false)return "";
    var rows=b.rows.map(function(r,j){var k=num(r.kecil),s=num(r.besar),m=num(r.sampel),e=num(r.tendik);
      return "<tr><td>"+(j+1)+"</td><td>"+esc(r.sekolah)+"</td><td>"+show(k)+"</td><td>"+show(s)+"</td><td>"+show(e)+"</td><td>"+show(m)+"</td><td>"+show(k+s+m+e)+"</td><td></td></tr>"}).join("");
    return '<section class="page"><div class="kop"><img src="'+LOGO+'" alt=""><div><b>SATUAN PELAYANAN PEMENUHAN GIZI (SPPG)</b><b>YAYASAN ABHINAYA DAKARA INDONESIA</b><i>Jl. Pahlawan 69 RT.003 RW.004 Kel. Karangduak, Kecamatan Kota Sumenep,<br>Kabupaten Sumenep Provinsi Jawa Timur</i></div></div>'+
    '<div class="jd">BERITA ACARA SERAH TERIMA (BAST)<br>PAKET MAKANAN PROGRAM MAKAN BERGIZI GRATIS<br><u>No. '+nomor(i)+'</u></div>'+
    '<p>Yang bertanda tangan di bawah ini :</p><p><b>PIHAK PERTAMA</b></p>'+
    '<p class="f"><span>Driver</span><span>: '+drv+'</span></p><p class="f"><span>Unit</span><span>: '+esc(st.unit)+'</span></p>'+
    '<p><b>PIHAK KEDUA</b></p><p class="f"><span>Nama Lembaga</span><span>: <b>'+esc(b.lembaga)+'</b></span></p>'+
    '<p class="f"><span>Kategori/ Sasaran</span><span>: Porsi Besar dan Porsi Kecil</span></p>'+
    '<p class="f"><span>Nama Penerima</span><span>: '+(b.penerima?esc(b.penerima):"............................................")+'</span></p>'+
    '<p class="isi">Pada hari ini, '+tg+' <b>PIHAK KEDUA</b> telah menerima Paket Makanan Bergizi Gratis dari <b>PIHAK PERTAMA,</b> Yang didistribusikan dalam keadaan baik dan akan dikembalikan dalam baik oleh <b>PIHAK KEDUA</b> kepada <b>PIHAK PERTAMA</b> setelah dikonsumsi oleh penerima manfaat. Adapun rincian pengiriman Paket Makanan Bergizi Gratis sebagai berikut :</p>'+
    '<table><tr><th rowspan="3" style="width:8%">No.</th><th rowspan="3">Sekolah</th><th colspan="5">Jumlah Porsi</th><th rowspan="3" style="width:16%">Waktu Penyerahan</th></tr><tr><th colspan="2">Siswa</th><th rowspan="2" style="width:9%">Tendik</th><th rowspan="2" style="width:9%">Sampel</th><th rowspan="2" style="width:9%">Total</th></tr><tr><th style="width:9%">Kecil</th><th style="width:9%">Besar</th></tr>'+rows+'</table>'+
    '<div class="ttd"><div>Diserahkan Oleh,<br><b>PIHAK PERTAMA</b><div class="gap"></div><b>.....................................</b><br>Driver</div>'+
    '<div>Diterima Oleh,<br><b>PIHAK KEDUA</b><div class="gap"></div><b>.....................................</b><br>PIC</div></div></section>';
  }).join("");
  document.getElementById("print").innerHTML=out;
}
function cnt(){var n=st.bast.filter(function(b){return b.print!==false}).length;document.getElementById("prn").textContent=n===st.bast.length?"Cetak semua":"Cetak "+n+" terpilih"}
function refresh(full){save();cnt();renderRekap();if(full)renderForm();else document.querySelectorAll(".no").forEach(function(e,i){e.textContent="No. "+nomor(i)});renderPrint()}

var list=document.getElementById("list");
list.addEventListener("input",function(e){
  var t=e.target;if(t.dataset.p!=null){st.bast[t.dataset.p].print=t.checked;save();renderPrint();cnt();return}var b=t.dataset.b;if(b==null)return;
  var o=st.bast[b],k=t.dataset.k;
  if(t.dataset.r!=null){var r=o.rows[t.dataset.r];r[k]=t.value;
    var el=document.getElementById("t"+b+"_"+t.dataset.r);if(el)el.textContent=num(r.kecil)+num(r.besar)+num(r.tendik)+num(r.sampel)}
  else o[k]=t.value;
  save();renderPrint();renderRekap();
});
list.addEventListener("click",function(e){
  var t=e.target.closest("button");if(!t)return;
  if(t.dataset.del!=null){if(confirm("Hapus BAST ini?")){st.bast.splice(t.dataset.del,1);refresh(true)}}
  else if(t.dataset.ra!=null){st.bast[t.dataset.ra].rows.push(S("","","",""));refresh(true)}
  else if(t.dataset.rd!=null){var p=t.dataset.rd.split("_"),o=st.bast[p[0]];if(o.rows.length>1){o.rows.splice(p[1],1);refresh(true)}}
});
[["tgl","tgl"],["st","st"],["drv","drv"],["unit","unit"]].forEach(function(p){
  var el=document.getElementById(p[0]);el.value=st[p[1]]==null?"":st[p[1]];
  el.addEventListener("input",function(){if(p[0]==="tgl")cloudReady=false;st[p[1]]=el.value;refresh(false);if(p[0]==="tgl")dateChanged()});
});
document.getElementById("add").onclick=function(){st.bast.push({lembaga:"",penerima:"",rows:[S("","","","")]});refresh(true);window.scrollTo(0,document.body.scrollHeight)};
document.getElementById("prn").onclick=function(){if(!st.bast.some(function(b){return b.print!==false})){alert("Pilih minimal satu BAST untuk dicetak.");return}syncTgl();refresh(false);window.print()};
document.getElementById("sel1").onclick=function(){st.bast.forEach(function(b){b.print=true});refresh(true)};
document.getElementById("sel0").onclick=function(){st.bast.forEach(function(b){b.print=false});refresh(true)};
var GS={url:GS_URL.trim(),pw:GS_PW},booted=false,cloudReady=false,gT,lastSeen="",dirty=false,saveSeq=0;
function gsOn(){return !!GS.url}
function jam(){return new Date().toLocaleTimeString("id-ID")}
function gsStatus(t,bad){var e=document.getElementById("gsst");if(!e)return;e.textContent=t;e.style.color=bad?"var(--danger)":"var(--mute)"}
function gsChk(j){if(!j||!j.ok)throw new Error((j&&j.error)||"respon tidak valid");return j}
function gsGet(p){p.pw=GS.pw;var q=Object.keys(p).map(function(k){return k+"="+encodeURIComponent(p[k])}).join("&");
  return fetch(GS.url+(GS.url.indexOf("?")<0?"?":"&")+q).then(function(r){return r.json()}).then(gsChk)}
function gsPost(b){b.pw=GS.pw;
  return fetch(GS.url,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(b)}).then(function(r){return r.json()}).then(gsChk)}
function cloudSave(){
  if(!gsOn()||!cloudReady||!st.tgl)return;
  var tg=st.tgl,data={st:st.st,drv:st.drv,unit:st.unit,bast:st.bast},seq=++saveSeq;
  dirty=true;clearTimeout(gT);gsStatus("Menyimpan...");
  gT=setTimeout(function(){
    gsPost({action:"save",tanggal:tg,data:data}).then(function(j){
      if(seq===saveSeq)dirty=false;
      if(tg===st.tgl)lastSeen=j.updated_at;
      gsStatus("Tersimpan di Google Sheet "+jam())
    }).catch(function(e){if(seq===saveSeq)dirty=false;gsStatus("Gagal menyimpan: "+e.message,true)})},900)}
function applyCloud(d,keep){
  if(!d||!d.bast)return;
  st.bast=d.bast;
  if(!keep)st.bast.forEach(function(b){b.print=true;b.rows.forEach(function(r){r.kecil="";r.besar="";r.tendik="";r.sampel=""})});
  if(d.drv!=null)st.drv=d.drv;if(d.unit)st.unit=d.unit;
  st.st=keep&&d.st?d.st:"";
  document.getElementById("st").value=st.st;document.getElementById("drv").value=st.drv||"";document.getElementById("unit").value=st.unit||"";
  try{localStorage.setItem(KEY,JSON.stringify(st))}catch(e){}
  renderForm();renderPrint();cnt();renderRekap()}
function cloudLoad(){
  var tg=st.tgl;if(!gsOn()||!tg)return Promise.resolve(false);
  gsStatus("Memuat data "+tg+"...");
  return gsGet({action:"get",tanggal:tg}).then(function(j){
    if(tg!==st.tgl)return false;
    if(j.row){applyCloud(j.row.data,true);lastSeen=j.row.updated_at;gsStatus("Data "+tg+" dimuat dari Google Sheet");return true}
    return gsGet({action:"last",before:tg}).then(function(k){
      if(tg!==st.tgl)return false;
      lastSeen="";
      if(k.row){applyCloud(k.row.data,false);gsStatus("Hari baru "+tg+": daftar lembaga dari hari terakhir, porsi dikosongkan")}
      else gsStatus("Tersambung. Belum ada data di Sheet, isian akan disimpan.");
      return true})
  }).catch(function(e){gsStatus("Gagal terhubung: "+e.message,true);return false})}
function dateChanged(){cloudReady=false;cloudLoad().then(function(ok){if(ok)cloudReady=true})}
function busy(){var a=document.activeElement;return !!(a&&a.tagName==="INPUT"&&a.type!=="checkbox")}
function poll(){
  if(!gsOn()||!cloudReady||dirty||document.hidden||!st.tgl)return;
  var tg=st.tgl;
  gsGet({action:"ping",tanggal:tg}).then(function(j){
    var u=j.updated_at||"";
    if(tg!==st.tgl||dirty||!u||u===lastSeen||busy())return;
    return gsGet({action:"get",tanggal:tg}).then(function(g){
      if(tg!==st.tgl||dirty||!g.row||busy())return;
      applyCloud(g.row.data,true);lastSeen=g.row.updated_at;gsStatus("Diperbarui dari perangkat lain "+jam())})
  }).catch(function(){})}
setInterval(poll,4000);
function p2(n){return n<10?"0"+n:""+n}
function today(){var d=new Date();return d.getFullYear()+"-"+p2(d.getMonth()+1)+"-"+p2(d.getDate())}
var elT=document.getElementById("tgl"),elA=document.getElementById("auto");
function syncTgl(){var o=st.tgl,a=st.auto!==false;if(a)st.tgl=today();elA.checked=a;elT.disabled=a;elT.value=st.tgl||"";if(booted&&o!==st.tgl)dateChanged()}
elA.addEventListener("change",function(){st.auto=elA.checked;syncTgl();refresh(false)});
document.addEventListener("visibilitychange",function(){if(!document.hidden&&st.auto!==false){syncTgl();refresh(false)}});
syncTgl();save();
renderForm();renderPrint();cnt();renderRekap();
booted=true;if(gsOn())dateChanged();
</script>
</body>
</html>
